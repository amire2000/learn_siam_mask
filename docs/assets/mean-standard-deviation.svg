<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" role="img" aria-labelledby="title description">
  <title id="title">Mean and standard deviation on a bell curve</title>
  <desc id="description">A bell curve centered at mu, with lines at one standard deviation below and above the mean, and a value one and a half standard deviations above the mean.</desc>
  <rect width="700" height="300" fill="#ffffff"/>
  <path d="M70 235 C150 235 190 65 350 65 C510 65 550 235 630 235 L630 235 L70 235 Z" fill="#dcecff"/>
  <path d="M70 235 C150 235 190 65 350 65 C510 65 550 235 630 235" fill="none" stroke="#1565c0" stroke-width="4"/>
  <line x1="60" y1="235" x2="650" y2="235" stroke="#263238" stroke-width="2"/>
  <line x1="250" y1="235" x2="250" y2="166" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="350" y1="235" x2="350" y2="65" stroke="#1565c0" stroke-width="3"/>
  <line x1="450" y1="235" x2="450" y2="166" stroke="#757575" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="500" cy="133" r="7" fill="#d32f2f"/>
  <line x1="500" y1="133" x2="500" y2="235" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="238" y="260" font-family="sans-serif" font-size="18" fill="#263238">μ − σ</text>
  <text x="343" y="260" font-family="sans-serif" font-size="20" fill="#1565c0">μ</text>
  <text x="438" y="260" font-family="sans-serif" font-size="18" fill="#263238">μ + σ</text>
  <text x="470" y="115" font-family="sans-serif" font-size="18" fill="#b71c1c">x = μ + 1.5σ</text>
  <text x="260" y="38" font-family="sans-serif" font-size="20" fill="#263238">Typical values cluster around the mean</text>
</svg>
